services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tenant_billing
      POSTGRES_USER: tenant_billing
      POSTGRES_PASSWORD: tenant_billing
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenant_billing -d tenant_billing"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["tenant-billing-data:/var/lib/postgresql/data"]
  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/tenant_billing
      DB_USERNAME: tenant_billing
      DB_PASSWORD: tenant_billing
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
  frontend:
    build: ./frontend
    ports: ["4200:80"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  tenant-billing-data:
