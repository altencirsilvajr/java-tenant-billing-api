apiVersion: v1
kind: ConfigMap
metadata: { name: tenant-billing-api }
data:
  DB_URL: jdbc:postgresql://postgresql:5432/tenant_billing
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: tenant-billing-api }
spec:
  replicas: 2
  selector: { matchLabels: { app: tenant-billing-api } }
  template:
    metadata: { labels: { app: tenant-billing-api } }
    spec:
      containers:
        - name: api
          image: ghcr.io/altencirsilvajr/java-tenant-billing-api:latest
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: tenant-billing-api }
            - secretRef: { name: tenant-billing-db }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8080 }, initialDelaySeconds: 15 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 8080 }, initialDelaySeconds: 30 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata: { name: tenant-billing-api }
spec:
  selector: { app: tenant-billing-api }
  ports: [{ port: 8080, targetPort: 8080 }]
